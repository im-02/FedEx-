<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - FedEx-livetracking.number</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #003399, #001a4d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #fff;
            border-radius: 20px;
            padding: 50px 45px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: #003399;
        }
        .login-logo .logo-text span { color: #ff6600; }
        .login-logo .logo-text small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #888;
            letter-spacing: 1px;
        }

        .login-container h2 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .login-container .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d0d5dd;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            background: #fafbfc;
        }
        .form-group input:focus {
            border-color: #003399;
            box-shadow: 0 0 0 4px rgba(0, 51, 153, 0.08);
            background: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #003399;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #002277;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 51, 153, 0.3);
        }
        .login-btn:disabled {
            background: #99a9c9;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #cc0000;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .login-footer {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-top: 20px;
            border-top: 1px solid #e8e8e8;
            padding-top: 20px;
        }
        .login-footer a {
            color: #003399;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="login-logo">
            <div class="logo-text">FedEx<span>-livetracking.number</span>
                <small>Admin Control Panel</small>
            </div>
        </div>

        <h2>🔐 Admin Login</h2>
        <p class="sub">Enter your credentials to access the admin panel</p>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="Enter email" autocomplete="username" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" />
        </div>

        <button class="login-btn" id="loginBtn">🚀 Login</button>

        <div class="error-msg" id="errorMsg">❌ Invalid email or password. Please try again.</div>

        <div class="login-footer">
            <a href="index.html">← Back to Tracking</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAueqbCcGN_LKDTd6YnPkPcWSIufFqsqwM",
            authDomain: "fedex-4bdba.firebaseapp.com",
            projectId: "fedex-4bdba",
            storageBucket: "fedex-4bdba.firebasestorage.app",
            messagingSenderId: "770647474446",
            appId: "1:770647474446:web:b824fa3219cc2be3ab575f",
            measurementId: "G-HG9VYPL989"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // If already logged in, skip straight to the panel
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'admin-panel.html';
        });

        async function login() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            if (!email || !password) {
                errorMsg.textContent = '❌ Please enter both email and password.';
                errorMsg.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'admin-panel.html';
            } catch (e) {
                errorMsg.textContent = '❌ Invalid email or password. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 Login';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('emailInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
